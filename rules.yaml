# Sorted - File Organization Rules
# Each rule has: name, priority (lower = higher priority), filters, and actions

rules:
  - name: "Organize by extension"
    priority: 10
    filters:
      - extension: [pdf, docx, xlsx]
    actions:
      - move: "Documents"

  - name: "Organize images"
    priority: 10
    filters:
      - extension: [jpg, png, gif, jpeg]
    actions:
      - move: "Pictures"

  - name: "Organize videos"
    priority: 10
    filters:
      - extension: [mp4, avi, mkv, mov]
    actions:
      - move: "Videos"

  - name: "Archive by prefix"
    priority: 5
    filters:
      - name_starts_with: "archive"
      - extension: [zip, rar, 7z]
    actions:
      - move: "Archives"
